name: Anchor CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: anchor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      ANTHROPIC_API_KEY: ci-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Run deterministic Gauntlet twice
        run: npm run gauntlet -- --repeat 2 --quiet --report artifacts/gauntlet/fixture-report.json

      - name: Upload Gauntlet report
        uses: actions/upload-artifact@v4
        with:
          name: anchor-gauntlet-fixture-report
          path: artifacts/gauntlet/fixture-report.json

      - name: Build production application
        run: npm run build

  live-gauntlet:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'emailjustin13-beep' &&
      contains(github.event.pull_request.title, '[live-gauntlet]')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_DRAFT_SCAN_MODEL: ${{ vars.ANTHROPIC_DRAFT_SCAN_MODEL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require the server-only provider secret
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Run one live model pass
        run: node scripts/run-gauntlet.mjs --mode live --repeat 1 --report artifacts/gauntlet/live-report.json

      - name: Upload live Gauntlet report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-live-gauntlet-pr-report
          path: artifacts/gauntlet/live-report.json
          if-no-files-found: warn
