name: Anchor CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: anchor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      ANTHROPIC_API_KEY: ci-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Run deterministic Gauntlet twice
        run: npm run gauntlet -- --repeat 2 --quiet --report artifacts/gauntlet/fixture-report.json

      - name: Upload Gauntlet report
        uses: actions/upload-artifact@v4
        with:
          name: anchor-gauntlet-fixture-report
          path: artifacts/gauntlet/fixture-report.json

      - name: Build production application
        run: npm run build
